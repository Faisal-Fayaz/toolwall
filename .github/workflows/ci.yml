name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22 is the declared floor; 24 is what this was developed against.
        node: [22, 24]
        # pathIsWithin is symlink-, separator- and case-sensitive, and it has
        # only ever run on Linux. Windows drive letters and macOS /private
        # prefixes are exactly where it should be expected to break.
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # keep the expensive packaging/interop legs on Linux only
          - os: ubuntu-latest
            node: 24
            full: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The OPA CLI compiles Rego to wasm. It is checksum-verified and never
      # shipped in the package — it is a build-time dependency only.
      - name: fetch OPA
        shell: bash
        run: npm run fetch:opa

      - name: typecheck
        run: npm run typecheck

      # Guards the invariant that a broken .rego must never replace a policy
      # that was working.
      - name: build policy
        run: npm run build:release

      # The pure-logic suites must pass everywhere: path containment, hooks,
      # policy, secrets, logging. Cross-platform breakage shows up here.
      - name: test (portable suites)
        if: runner.os != 'Windows'
        run: |
          npm run test:engine
          npm run test:hooks
          npm run test:multi-agent
          npm run test:base64
          npm run test:log
          npm run test:secrets
          npm run test:approval
          npm run test:replay

      # Windows needs the bash-based scripts, which run under Git Bash.
      - name: test (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm run test:engine
          npm run test:hooks
          npm run test:multi-agent
          npm run test:secrets
          npm run test:approval

      - name: test (full, linux only)
        if: matrix.full
        run: |
          npm run test:exfiltration
          npm run test:interop
          npm run test:http
          npm run test:integration
          npm run test:packaging
          npm run test:hook:e2e

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fetch:opa
      - run: npm run build:release
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  linux-musl:
    name: linux (self-hosted smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run fetch:opa
      - run: npm run build:release
      # Nothing here should need a writable HOME beyond the default. This is
      # the only job that proves the published artifact works on a machine
      # that has never seen this repository: no OPA binary, no source.
      - name: smoke test the installed CLI
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          npm pack --pack-destination "$tmp" >/dev/null
          cd "$tmp"
          npm init -y >/dev/null
          # *.tgz, not toolwall-*.tgz: the filename carries the scope.
          npm install ./*.tgz --no-audit --no-fund
          pkg="$(node -p "require('./package.json').name")"
          echo "installed $pkg"
          # run the shim npm created — this is what users get
          ./node_modules/.bin/toolwall --help | head -3
          ./node_modules/.bin/toolwall check --cwd . | tail -2